server:
  port: 8080
  servlet:
    context-path: /zwz

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hivenote?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 注意：file 必须顶头写，不要有缩进
file:
  upload-path: D:/hivenote/files/
  access-path: /file/view/

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl